# Prometheus scrape targets inside the compose network (profile "monitoring"; docs/DEPLOYMENT.md, Metrics).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api            # GET /metrics: requests, latency, /ask statuses, tokens (api/services/metrics.py)
    static_configs:
      - targets: ["api:8000"]
  - job_name: node           # the server: CPU, memory, disks, load
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: postgres       # connections, database sizes, longest transaction
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
