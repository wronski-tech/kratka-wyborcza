# Alert rules (docs/DEPLOYMENT.md, Alerts); tests in alerts.test.yml (promtool test rules, run in CI).
# Prometheus evaluates them, Alertmanager sends firing and resolved alerts to ALERT_WEBHOOK_SECRET.
groups:
  - name: kratka-wyborcza
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} does not answer Prometheus for 5 minutes"

      - alert: DiskAlmostFull
        expr: >-
          100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is {{ $value | printf \"%.0f\" }}% full"

      # Generated SQL stops after 5 s (statement_timeout of the reader role); this catches the rest. Restores,
      # dumps and psql sessions of deploy_mart.sh and the backup run long by design.
      - alert: SlowQuery
        expr: >-
          max by (datname, usename) (pg_stat_activity_max_tx_duration{datname=~"kratka_wyborcza.*",
          application_name!~"pg_restore|pg_dump|psql"}) > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A transaction of {{ $labels.usename }} in {{ $labels.datname }} runs for {{ $value | humanizeDuration }}"

      - alert: ServerErrors
        expr: >-
          sum(rate(kratka_wyborcza_http_requests_total{status=~"5.."}[10m]))
          / sum(rate(kratka_wyborcza_http_requests_total{route!="/metrics"}[10m])) > 0.05
          and sum(rate(kratka_wyborcza_http_requests_total{route!="/metrics"}[10m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value | humanizePercentage }} of API requests end in a 5xx error"

      # About 2 USD per hour with gpt-4o-mini and occasional gpt-4o repairs; raise it with real traffic.
      - alert: TokenSpike
        expr: sum(increase(kratka_wyborcza_llm_tokens_total[1h])) > 2000000
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanize }} model tokens in the last hour"

      # deploy/backup_storagebox.sh writes the time of its last complete run (node-exporter textfile).
      - alert: BackupStale
        expr: time() - kratka_wyborcza_backup_last_success_timestamp_seconds > 30 * 3600
        labels:
          severity: critical
        annotations:
          summary: "The last complete backup to the Storage Box was {{ $value | humanizeDuration }} ago"

      - alert: BackupNeverRan
        expr: absent(kratka_wyborcza_backup_last_success_timestamp_seconds)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "No backup to the Storage Box is recorded on this server (deploy/backup.env missing?)"
