# promtool test rules alerts.test.yml (CI, compose job)
rule_files:
  - alerts.yml
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="api"}'
        values: "1 0x10"
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/mnt/data"}'
        values: "10x20"
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/mnt/data"}'
        values: "100x20"
      - series: 'node_filesystem_avail_bytes{fstype="tmpfs",mountpoint="/run"}'
        values: "1x20"
      - series: 'node_filesystem_size_bytes{fstype="tmpfs",mountpoint="/run"}'
        values: "100x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 7m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: critical, job: api}
            exp_annotations: {summary: "api does not answer Prometheus for 5 minutes"}
      - eval_time: 15m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels: {severity: warning, fstype: ext4, mountpoint: /mnt/data}
            exp_annotations: {summary: "Disk /mnt/data is 90% full"}

  # A long transaction of the API alerts; the restore of deploy_mart.sh does not.
  - interval: 1m
    input_series:
      - series: 'pg_stat_activity_max_tx_duration{datname="kratka_wyborcza",usename="kratka_wyborcza",application_name="",state="active"}'
        values: "0 200x10"
      - series: 'pg_stat_activity_max_tx_duration{datname="kratka_wyborcza_mart_b",usename="kratka_wyborcza",application_name="pg_restore",state="active"}'
        values: "0 900x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: SlowQuery
        exp_alerts:
          - exp_labels: {severity: warning, datname: kratka_wyborcza, usename: kratka_wyborcza}
            exp_annotations: {summary: "A transaction of kratka_wyborcza in kratka_wyborcza runs for 3m 20s"}

  # 10 % errors at 1 request/s alert; the same share at a trickle of traffic does not.
  - interval: 1m
    input_series:
      - series: 'kratka_wyborcza_http_requests_total{route="/ask",status="200"}'
        values: "0+54x30"
      - series: 'kratka_wyborcza_http_requests_total{route="/ask",status="500"}'
        values: "0+6x30"
      - series: 'kratka_wyborcza_http_requests_total{route="/metrics",status="200"}'
        values: "0+1000x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ServerErrors
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "10% of API requests end in a 5xx error"}
  - interval: 1m
    input_series:
      - series: 'kratka_wyborcza_http_requests_total{route="/ask",status="200"}'
        values: "0+0.27x30"
      - series: 'kratka_wyborcza_http_requests_total{route="/ask",status="500"}'
        values: "0+0.03x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ServerErrors
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'kratka_wyborcza_llm_tokens_total{kind="prompt"}'
        values: "0+40000x60"
    alert_rule_test:
      - eval_time: 30m
        alertname: TokenSpike
        exp_alerts: []
      - eval_time: 60m
        alertname: TokenSpike
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "2.4M model tokens in the last hour"}

  # Last backup at t=0; 30 h later it is stale. Without the metric, BackupNeverRan fires after 2 h.
  - interval: 1h
    input_series:
      - series: "kratka_wyborcza_backup_last_success_timestamp_seconds"
        values: "0x40"
    alert_rule_test:
      - eval_time: 29h
        alertname: BackupStale
        exp_alerts: []
      - eval_time: 31h
        alertname: BackupStale
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "The last complete backup to the Storage Box was 1d 7h 0m 0s ago"}
      - eval_time: 31h
        alertname: BackupNeverRan
        exp_alerts: []
  - interval: 1h
    input_series:
      - series: 'up{job="api"}'
        values: "1x3"
    alert_rule_test:
      - eval_time: 3h
        alertname: BackupNeverRan
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "No backup to the Storage Box is recorded on this server (deploy/backup.env missing?)"}
