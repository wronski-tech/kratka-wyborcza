# Weekly update pull requests; CI (unit, lint with pip-audit, full mart build) checks each one.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/api", "/loader"]
    schedule: { interval: weekly }
    # Minor and patch updates come in one pull request; every major update gets its own, since those
    # usually need code changes (one library at a time).
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories: ["/docker"]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: "/infra/hetzner"
    schedule: { interval: weekly }
