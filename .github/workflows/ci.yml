# Unit tests (no DB), then integration against PostgreSQL 16 (pgvector): DB tests, a full mart
# build from the committed parquet files, and a check that every curated SQL example still runs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            loader/requirements.txt
            streamlit_app/requirements.txt

      - name: Install dependencies
        # The UI's requirements for tests/test_ui_apptest.py (Streamlit AppTest).
        run: pip install -r api/requirements.txt -r loader/requirements.txt -r streamlit_app/requirements.txt coverage==7.17.0

      - name: Run unit tests
        run: PYTHONPATH=. coverage run -m unittest discover -s tests -p 'test*.py' -v

      # Per-file table in the job summary; fails below fail_under in .coveragerc.
      - name: Coverage
        run: coverage report --format=markdown | tee -a "$GITHUB_STEP_SUMMARY"

  # Ruff (errors only, ruff.toml), mypy (mypy.ini, with a baseline of modules not yet clean), pip-audit and
  # links between the repository's Markdown files (offline: external sites are not fetched).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            loader/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt -r loader/requirements.txt ruff==0.17.3 mypy==2.4.1 pip-audit

      - name: Ruff
        run: ruff check api scripts streamlit_app tests

      - name: Mypy
        run: mypy

      - name: Known vulnerabilities in pinned dependencies
        run: pip-audit -r api/requirements.txt -r loader/requirements.txt --progress-spinner off

      - name: Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  integration:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: plujka
          POSTGRES_PASSWORD: plujka
          POSTGRES_DB: plujka
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plujka -d plujka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://plujka:plujka@localhost:5432/plujka
      MART_DATABASE_URL: postgresql://plujka_mart_reader:plujka_mart_reader@localhost:5432/plujka
      PLUJKA_RUN_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            loader/requirements.txt

      - name: Install dependencies
        # hypothesis: property tests of mart.allocate_seats (tests/test_seats_properties.py).
        run: pip install -r api/requirements.txt -r loader/requirements.txt hypothesis==6.170.14

      - name: Run tests (including DB integration)
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test*.py' -v

      # The base tables depend only on the data and the family builders: when neither changed, restore
      # them from the cached dump; persons, views and the seat check are always rebuilt.
      - name: Mart cache
        id: mart-cache
        uses: actions/cache/restore@v4
        with:
          path: mart.dump
          key: mart-${{ hashFiles('data/kbw_stage_parquet/**', 'data/pkw_stage_parquet/**', 'data/gus/**', 'data/pkw_html/**', 'api/services/mart/build_*.py', 'api/services/mart/person_overrides.csv', 'api/services/mart/schema.py', 'scripts/build_mart.py') }}

      # Every consistency check in the builders must pass on PostgreSQL 16 with the committed data.
      # Families build in three processes (4 vCPU, 16 GB runner); persons and views follow serially.
      - name: Build the mart from committed parquet
        if: steps.mart-cache.outputs.cache-hit != 'true'
        env:
          MART_DUCKDB_MEMORY_LIMIT: 3GB
        run: |
          start=$(date +%s)
          PYTHONPATH=. python -u scripts/build_mart.py --jobs 3
          echo "MART_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Restore cached base tables and rebuild derived objects
        if: steps.mart-cache.outputs.cache-hit == 'true'
        run: |
          start=$(date +%s)
          # The DB tests above created an empty mart schema; the dump brings its own.
          docker exec -i ${{ job.services.postgres.id }} psql -U plujka -d plujka -v ON_ERROR_STOP=1 \
            -c "DROP SCHEMA IF EXISTS mart CASCADE" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          docker exec -i ${{ job.services.postgres.id }} pg_restore -U plujka -d plujka --no-owner --no-privileges \
            --exit-on-error --section=pre-data --section=data < mart.dump
          PYTHONPATH=. python -u scripts/build_mart.py --derived-only
          echo "MART_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Check curated SQL examples against the built mart
        run: PYTHONPATH=. python scripts/add_sql_example.py --check

      # Reference queries of the evaluation set (the nightly Eval workflow grades the model against them).
      - name: Check the evaluation set against the built mart
        run: PYTHONPATH=. python scripts/run_eval.py --check

      # On the mart just built: /ask end to end with a fake OpenAI server (tests/test_e2e_stubbed_llm.py) and
      # the contract of every endpoint (tests/test_contracts_mart.py), entities on the lexicon (tests/test_entities_mart.py).
      - name: Tests against the built mart
        run: make test-mart PYTHON=python

      # Concurrent questions and browse requests with a fake model (scripts/load_test.py); latency table in the
      # job summary. The p95 limit is loose (shared runners): the check is mainly that nothing fails under load.
      - name: Load test with a fake model
        run: PYTHONPATH=. python scripts/load_test.py --requests 300 --concurrency 16 --max-p95-ms 8000 | tee -a "$GITHUB_STEP_SUMMARY"

      # The nightly backup (public schema: question log tables, saved views, token usage) restored into an empty
      # database by the procedure in docs/DEPLOYMENT.md must have the same tables, indexes and rows.
      - name: Backup and restore
        run: |
          pg_dump --version
          PYTHONPATH=. python -c "
          from api.services import db
          db.init_database()
          db.save_view('restore check', 'SELECT 1')
          db.record_usage('ci', {'gpt-4o-mini': {'prompt_tokens': 10, 'completion_tokens': 2}})"
          BACKUP_SCHEMAS=public scripts/backup_db.sh /tmp/backups
          psql "$DATABASE_URL" -c "CREATE DATABASE plujka_restore"
          restored=postgresql://plujka:plujka@localhost:5432/plujka_restore
          pg_restore --clean --if-exists --no-owner --exit-on-error -d "$restored" /tmp/backups/plujka-*.dump
          PYTHONPATH=. python scripts/check_restore.py "$DATABASE_URL" "$restored" --schemas public

      - name: Dump the mart
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U plujka -n mart -Fc -Z 6 plujka > mart.dump
          sha256sum mart.dump > mart.dump.sha256

      - name: Save mart cache
        if: steps.mart-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mart.dump
          key: ${{ steps.mart-cache.outputs.cache-primary-key }}

      # Sizes that limit this setup: the release asset (2 GB per file) and the runner's disk.
      - name: Mart sizes
        run: |
          mart=$(docker exec ${{ job.services.postgres.id }} psql -U plujka -d plujka -Atc \
            "SELECT sum(pg_total_relation_size(c.oid)) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'mart'")
          dump=$(stat -c %s mart.dump)
          free=$(df --output=avail -B1 . | tail -1)
          {
            echo "| measure | value |"
            echo "| --- | --- |"
            echo "| mart in PostgreSQL | $(numfmt --to=iec "$mart") |"
            echo "| mart.dump | $(numfmt --to=iec "$dump") |"
            echo "| free disk | $(numfmt --to=iec "$free") |"
            echo "| build (cache hit: ${{ steps.mart-cache.outputs.cache-hit == 'true' }}) | ${MART_BUILD_SECONDS} s |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$dump" -gt 1500000000 ]; then echo "::warning::mart.dump is $(numfmt --to=iec "$dump"); release assets are limited to 2 GB"; fi
          if [ "$free" -lt 5000000000 ]; then echo "::warning::only $(numfmt --to=iec "$free") free on the runner"; fi

      # deploy/deploy_mart.sh downloads this asset; only main publishes it.
      - name: Publish the mart dump (release mart-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mart-latest >/dev/null 2>&1 || gh release create mart-latest --prerelease \
            --title "Mart (latest main)" --notes "pg_dump -n mart of the mart built and checked by CI; deploy with deploy/deploy_mart.sh."
          gh release upload mart-latest mart.dump mart.dump.sha256 --clobber
          gh release edit mart-latest --notes "Built from ${GITHUB_SHA} by CI run ${GITHUB_RUN_ID}. pg_dump -n mart; deploy with deploy/deploy_mart.sh."

  # The images and docker-compose.yml as users run them: build, start, and answer one request.
  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files and profiles
        run: |
          docker compose config -q
          docker compose --profile tools --profile redis --profile observability --profile monitoring config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          touch deploy/caddy.env
          POSTGRES_PASSWORD=x MART_READER_PASSWORD=x GRAFANA_ADMIN_PASSWORD=x \
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config -q

      - name: Alert rules and Alertmanager config
        run: |
          docker run --rm -v "$PWD/docker/monitoring:/m" -w /m --entrypoint promtool prom/prometheus:v2.55.1 check rules alerts.yml
          docker run --rm -v "$PWD/docker/monitoring:/m" -w /m --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts.test.yml
          sed -e 's/__RECEIVER__/chat/' -e 's|__WEBHOOK__|https://hooks.example.org/x|' docker/monitoring/alertmanager.yml > /tmp/am.yml
          docker run --rm -v /tmp/am.yml:/am.yml --entrypoint amtool prom/alertmanager:v0.27.0 check-config /am.yml

      - name: Build images
        run: docker compose --profile tools build

      - name: Start the stack
        run: docker compose up -d postgres opensearch api streamlit

      - name: Smoke test
        run: |
          for i in $(seq 1 60); do curl -fsS localhost:8000/health >/dev/null && break; sleep 5; done
          curl -fsS localhost:8000/health | jq -e '.status == "ok"'
          # No OpenAI key and no mart in this job: the request must still succeed (empty dynamic_sql answer).
          curl -fsS -X POST localhost:8000/ask -H 'Content-Type: application/json' \
            -d '{"question": "Frekwencja w referendum 2023"}' | jq -e '.intent == "dynamic_sql" and (.answer.text | length > 0)'
          for i in $(seq 1 30); do curl -fsS localhost:8501/_stcore/health && break; sleep 2; done

      # Prometheus scrapes all four targets and has the API's /ask counter; Grafana provisioned the dashboard.
      - name: Metrics stack
        run: |
          docker compose --profile monitoring up -d prometheus alertmanager grafana node-exporter postgres-exporter loki alloy
          up='[.data.result[] | select(.value[1] == "1")] | length == 4'
          for i in $(seq 1 30); do curl -fsS 'localhost:9090/api/v1/query?query=up' | jq -e "$up" >/dev/null && break; sleep 5; done
          curl -fsS 'localhost:9090/api/v1/query?query=up' | jq -e "$up"
          curl -fsS 'localhost:9090/api/v1/query?query=plujka_ask_total' | jq -e '.data.result | length > 0'
          curl -fsS localhost:9090/api/v1/rules | jq -e '[.data.groups[].rules[] | select(.health == "ok")] | length == 7'
          curl -fsS localhost:9090/api/v1/alertmanagers | jq -e '.data.activeAlertmanagers | length == 1'
          for i in $(seq 1 30); do curl -fsS -u admin:admin localhost:3000/api/health >/dev/null && break; sleep 2; done
          curl -fsS -u admin:admin localhost:3000/api/dashboards/uid/plujka | jq -e '.dashboard.title == "Kratka Wyborcza"'
          # Alloy ships the API's log lines (with their request ids) to Loki.
          loki='localhost:3000/api/datasources/proxy/uid/loki/loki/api/v1'
          for i in $(seq 1 30); do curl -fsS -u admin:admin "$loki/label/service/values" | jq -e '.data | index("api")' >/dev/null && break; sleep 5; done
          curl -fsS -u admin:admin -G "$loki/query_range" --data-urlencode 'query={service="api"} |= "request_id="' \
            | jq -e '.data.result | length > 0'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 300

      - name: Stop the stack
        if: always()
        run: docker compose down -v
