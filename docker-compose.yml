services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: plujka-postgres
    environment:
      POSTGRES_DB: plujka
      POSTGRES_USER: plujka
      POSTGRES_PASSWORD: plujka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plujka -d plujka"]
      interval: 5s
      timeout: 5s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: plujka-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-PlujkaAdmin123!}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: plujka-api
    environment:
      DATABASE_URL: postgresql://plujka:plujka@postgres:5432/plujka
      # Read-only role created by scripts/build_mart.py; used for LLM-generated SQL.
      MART_DATABASE_URL: postgresql://plujka_mart_reader:${MART_READER_PASSWORD:-plujka_mart_reader}@postgres:5432/plujka
      # production refuses to start with default passwords or without a rate limit.
      PLUJKA_ENV: ${PLUJKA_ENV:-development}
      ASK_RATE_LIMIT_PER_MINUTE: ${ASK_RATE_LIMIT_PER_MINUTE:-30}
      QUESTION_MAX_CHARS: ${QUESTION_MAX_CHARS:-500}
      SESSION_QUESTION_LIMIT: ${SESSION_QUESTION_LIMIT:-100}
      # Shared rate limit across workers/replicas, e.g. redis://redis:6379/0 with the "redis" profile.
      REDIS_URL: ${REDIS_URL:-}
      DAILY_TOKEN_LIMIT_PER_CLIENT: ${DAILY_TOKEN_LIMIT_PER_CLIENT:-0}
      # Comma-separated keys; when set, POST /ask and /feedback require the X-API-Key header.
      API_KEYS: ${API_KEYS:-}
      # Keys that may read GET /costs (the cost panel, ?panel=koszty in the UI).
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:-}
      LLM_PRICES_USD_PER_1M: ${LLM_PRICES_USD_PER_1M:-}
      QUESTION_COST_LIMIT_USD: ${QUESTION_COST_LIMIT_USD:-0.10}
      OPENSEARCH_URL: http://opensearch:9200
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_REPAIR_MODEL: ${OPENAI_REPAIR_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      # LLM provider: openai (OPENAI_BASE_URL for an OpenAI-compatible endpoint) or azure (Azure OpenAI, model
      # settings above are deployment names).
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      EMBEDDING_DIM: "128"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    container_name: plujka-streamlit
    environment:
      API_URL: http://api:8000
      PLUJKA_API_KEY: ${PLUJKA_API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      - api

  loader:
    build:
      context: .
      dockerfile: docker/loader.Dockerfile
    container_name: plujka-loader
    environment:
      DATABASE_URL: postgresql://plujka:plujka@postgres:5432/plujka
      # The build sets the reader role's password from this URL.
      MART_DATABASE_URL: postgresql://plujka_mart_reader:${MART_READER_PASSWORD:-plujka_mart_reader}@postgres:5432/plujka
      OPENSEARCH_URL: http://opensearch:9200
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        python -u scripts/kbw_stage_duckdb.py --root /app/data/kbw_mirror/dane --out /app/data/kbw_stage_parquet &&
        for d in /app/data/pkw_all/sejmsenat*/zip; do python -u scripts/kbw_stage_duckdb.py --root "$$d" --out /app/data/pkw_stage_parquet; done &&
        python -u scripts/import_kbw_facts.py --root /app/data/kbw_mirror/dane --wait-db-seconds 600 &&
        python -u scripts/build_mart.py --parquet-root /app/data/kbw_stage_parquet --pkw-parquet-root /app/data/pkw_stage_parquet --wait-db-seconds 600
    profiles:
      - tools

  redis:
    image: redis:7-alpine
    container_name: plujka-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    profiles:
      - redis

  # Kibana-like UI for the question_logs index (status, latency, tokens, errors).
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: plujka-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    profiles:
      - observability

  # Metrics (docs/DEPLOYMENT.md, Metrics): Prometheus scrapes the API's /metrics, the server and Postgres;
  # Grafana shows the provisioned dashboard "Plujka" at http://localhost:3000.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: plujka-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
              "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring

  # Sends alerts (docker/monitoring/alerts.yml) to a Slack-compatible webhook; without one they only show here.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: plujka-alertmanager
    environment:
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        if [ -n "$$ALERT_WEBHOOK_SECRET" ]; then receiver=chat; else receiver=none; fi;
        url=$$(printf %s "$${ALERT_WEBHOOK_SECRET:-http://localhost/disabled}" | sed 's/[&|\\]/\\&/g');
        sed -e "s|__RECEIVER__|$$receiver|" -e "s|__WEBHOOK__|$$url|" /etc/alertmanager/template.yml > /tmp/alertmanager.yml;
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    volumes:
      - ./docker/monitoring/alertmanager.yml:/etc/alertmanager/template.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.1
    container_name: plujka-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/plujka.json
    volumes:
      - ./docker/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/plujka.yml:ro
      - ./docker/monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/plujka.yml:ro
      - ./docker/monitoring/grafana/plujka.json:/etc/grafana/dashboards/plujka.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: plujka-node-exporter
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    profiles:
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: plujka-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://plujka:plujka@postgres:5432/plujka?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - monitoring

volumes:
  postgres_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
